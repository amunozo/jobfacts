# Swiss location data for src/jobfacts/locations.py.
# Places come from the official register in swiss_places.csv (swisstopo, see scripts/build_places.py).
# This file holds what the register cannot: the 26 cantons with names in four languages and a few
# major places each, multilingual aliases of well-known places, and the ambiguity lists.
# Written by hand on 2 Nov 2026 from general knowledge. Names are matched case-insensitively and
# without accents.

country = ["Switzerland", "Schweiz", "Suisse", "Svizzera", "Svizra", "Swiss", "Confoederatio Helvetica"]
# Matched only as an upper-case token inside a job board's location field.
country_codes = ["CH", "CHE"]

# Names that are also ordinary words (German "Zug" = train, "Baden" = bathing, ...). In free text
# they match only when capitalised and next to a location cue ("in", "bei", ", Switzerland" ...).
# Besides this list, every register name of up to 4 letters is treated the same way, except
# the names in `strong`.
ambiguous = ["Aigle", "Au", "Baar", "Bad", "Baden", "Berg", "Biel", "Boden", "Brig", "Brunnen", "Buch", "Bulle", "Cham", "Court", "Dorf", "Egg", "Freiburg", "Gais", "Gland", "Hausen", "Hof", "Horn", "Ins", "Jura", "Lachen", "Land", "Lenk", "Lens", "Linden", "Mett", "Moos", "Mühle", "Orbe", "Rain", "Ried", "Rolle", "Rue", "Sax", "Sent", "Sion", "Stein", "Thal", "Thun", "Uri", "Wald", "Wil", "Zug"]
# Register names that are common words or employer names. Found on 2 Nov 2026 by listing
# register names that appear in lower case at least 3 times in ~5,500 collected postings
# (sales, mission, fully ...), plus Roche (employer) and a few by hand. Same rule as above.
