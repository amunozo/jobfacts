[project]
name = "jobfacts"
version = "0.1.0"
description = "The facts a job posting hides: collector, extraction and search."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "lingua-language-detector>=2.2.0",
    "openai>=3.42.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "typesafe-sdk>=0.7.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
jobfacts = "jobfacts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfacts"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the PostgreSQL from docker compose"]
