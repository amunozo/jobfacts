name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobfacts
          POSTGRES_PASSWORD: jobfacts
          POSTGRES_DB: jobfacts
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobfacts -d jobfacts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jobfacts:jobfacts@localhost:5433/jobfacts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # Accuracy gate: re-applies the code rules to recorded model answers (no model calls, no
      # database). Pull requests from forks get no secret; the flag turns that into a skip.
      - run: uv run jobfacts gate check --skip-without-key
        env:
          JOBFACTS_GATE_KEY: ${{ secrets.JOBFACTS_GATE_KEY }}
